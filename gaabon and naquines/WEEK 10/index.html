<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <title>Grade Checker</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
  <main class='card'>
    <h1>Grade Checker</h1>
    <label for='studentInput'>Student name</label>
    <input id='studentInput' type='text' placeholder='e.g. Juan Dela Cruz'>
    <label for='scoreInput'>Score (0 to 100)</label>
    <input id='scoreInput' type='number' min='0' max='100' value='0'>
    <button id='checkBtn'>Check grade</button>
    <p id='output'></p>
  </main>
  <script src='app.js' defer></script>
</body>
</html>
